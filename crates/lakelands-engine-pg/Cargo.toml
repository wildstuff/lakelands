[package]
name = "lakelands-engine-pg"
description = "The PostgreSQL engine for Lakelands: a lake kept in one schema, its log as the format's lines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lakelands-api.workspace = true
lakelands-core.workspace = true
# The synchronous client: the engine seam is synchronous, as it is for
# SQLite; the store runs engine work on the blocking pool.
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }

[dev-dependencies]
serde_json.workspace = true
lakelands-store.workspace = true
peak_alloc.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
