[package]
name = "lakelands-client"
description = "A lake over the REST door: the contract's LakeStore, Catalog and ChangeFeed for a lake another process serves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes = "1"
futures-core.workspace = true
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
lakelands-api.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"

[dev-dependencies]
lakelands-core.workspace = true
lakelands-engine-mem.workspace = true
lakelands-mock.workspace = true
lakelands-server = { path = "../lakelands-server" }
lakelands-store.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
