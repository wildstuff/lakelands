[package]
name = "lakelands-cli"
description = "The lakelands command-line door."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lakelands"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
fs4.workspace = true
futures-core.workspace = true
lakelands-api.workspace = true
lakelands-backings.workspace = true
lakelands-core.workspace = true
lakelands-engine-mem.workspace = true
lakelands-engine-pg = { workspace = true, optional = true }
lakelands-engine-sqlite.workspace = true
lakelands-server = { path = "../lakelands-server" }
lakelands-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "net", "io-std"] }

[dev-dependencies]
async-trait.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
lakelands-client = { path = "../lakelands-client" }
postgres = "0.19"
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "process", "io-util"] }

[features]
# The PostgreSQL engine links a database client; a build without it
# (`--no-default-features`) opens SQLite and in-memory lakes only.
default = ["pg"]
pg = ["dep:lakelands-engine-pg"]

[lints]
workspace = true
