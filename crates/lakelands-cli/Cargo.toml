[package]
name = "lakelands-cli"
description = "The lakelands command-line door."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lakelands"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
futures-core.workspace = true
lakelands-api.workspace = true
lakelands-core.workspace = true
lakelands-server = { path = "../lakelands-server" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
lakelands-mock.workspace = true

[lints]
workspace = true
