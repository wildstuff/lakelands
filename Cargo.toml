[workspace]
resolver = "3"
members = [
    "crates/lakelands-api",
    "crates/lakelands-core",
    "crates/lakelands-store",
    "crates/lakelands-engine-sqlite",
    "crates/lakelands-engine-pg",
    "crates/lakelands-engine-mem",
    "crates/lakelands-mock",
    "crates/lakelands-cli",
    "crates/lakelands-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wildstuff/lakelands"
publish = false

[workspace.dependencies]
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", default-features = false }
async-trait = "0.1"
futures-core = "0.3"
regex = "1"
lakelands-core = { path = "crates/lakelands-core" }
lakelands-store = { path = "crates/lakelands-store" }
lakelands-engine-mem = { path = "crates/lakelands-engine-mem" }
lakelands-engine-sqlite = { path = "crates/lakelands-engine-sqlite" }
rust_decimal = "1"
ryu = "1"
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-saphyr = "1.1"
sha2 = "0.10"
unicode-normalization = "0.1"
lakelands-api = { path = "crates/lakelands-api" }
lakelands-mock = { path = "crates/lakelands-mock" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
