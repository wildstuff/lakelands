[workspace]
resolver = "3"
members = [
    "crates/lakelands-api",
    "crates/lakelands-core",
    "crates/lakelands-store",
    "crates/lakelands-engine-sqlite",
    "crates/lakelands-engine-pg",
    "crates/lakelands-engine-mem",
    "crates/lakelands-mock",
    "crates/lakelands-cli",
    "crates/lakelands-server",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wildstuff/lakelands"
publish = false

[workspace.dependencies]
tokio = { version = "1", default-features = false }
async-trait = "0.1"
futures-core = "0.3"
regex = "1"
lakelands-core = { path = "crates/lakelands-core" }
lakelands-store = { path = "crates/lakelands-store" }
rust_decimal = "1"
ryu = "1"
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
unicode-normalization = "0.1"
lakelands-api = { path = "crates/lakelands-api" }
lakelands-mock = { path = "crates/lakelands-mock" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# With rust-version 1.88, clippy asks for nested `if let`s to become
# let-chains and for `x % n == 0` to become `is_multiple_of`. The core
# crates are rewritten in one sweep once the core ladder has no open step
# on them, so no open branch meets a mechanical conflict; until then both
# suggestions are off for the whole workspace.
collapsible_if = "allow"
manual_is_multiple_of = "allow"
