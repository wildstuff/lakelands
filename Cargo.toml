[workspace]
resolver = "3"
members = [
    "crates/lakelands-api",
    "crates/lakelands-core",
    "crates/lakelands-store",
    "crates/lakelands-engine-sqlite",
    "crates/lakelands-engine-pg",
    "crates/lakelands-engine-mem",
    "crates/lakelands-door-checks",
    "crates/lakelands-cli",
    "crates/lakelands-server",
    "crates/lakelands-backings",
    "crates/lakelands-client",
]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/wildstuff/lakelands"
publish = false

[workspace.dependencies]
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", default-features = false }
async-trait = "0.1"
futures-core = "0.3"
regex = "1"
# A counting global allocator for the conformance tests' heap meter; the
# workspace forbids unsafe code, which an allocator needs.
peak_alloc = "0.3"
# Sets a file size limit for the SQLite engine's tests of a write the kernel
# cuts short; the workspace forbids unsafe code, which the call needs.
rustix = { version = "1.1", features = ["process"] }
lakelands-core = { path = "crates/lakelands-core" }
lakelands-store = { path = "crates/lakelands-store" }
lakelands-engine-mem = { path = "crates/lakelands-engine-mem" }
lakelands-engine-pg = { path = "crates/lakelands-engine-pg" }
lakelands-engine-sqlite = { path = "crates/lakelands-engine-sqlite" }
rust_decimal = "1"
ryu = "1"
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
serde-saphyr = "1.1"
sha2 = "0.10"
# A source's values sealed under its key (058).
aes-gcm-siv = "0.11"
# Its key schedule wiped when dropped.
aes = { version = "0.8", features = ["zeroize"] }
base64 = "0.22"
hmac = "0.12"
zeroize = "1"
unicode-normalization = "0.1"
lakelands-api = { path = "crates/lakelands-api" }
lakelands-backings = { path = "crates/lakelands-backings" }
lakelands-door-checks = { path = "crates/lakelands-door-checks" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# A PostgreSQL connection authenticates with SCRAM, thousands of rounds of
# HMAC-SHA-256; unoptimised, each connection the pg engine's tests open
# takes over 100 ms. Only these crates are optimised in dev builds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.postgres-protocol]
opt-level = 3
